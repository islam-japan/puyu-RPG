if(xz=='hb'){xz=null;const f=!P.hb;P.hb=1;P.bk.hb=1;if(f)P.g+=30000;P.a=SEC;save();return show(`<div style="font-size:56px">🐉</div><div>${m}<br>${f?'初回ほうしゅう 30000G!<br>':''}🏆 しんの勇者の しょうごうを てにいれた!</div>`,[['ひみつの町へ',enterTown]])}if(xz=='dun'&&bs){dn++;save();return show(`<div>${m}</div>`,[['つぎのかいへ',startF]])}if(xz=='arena'){P.ba++;const last=arn>=3;if(last)P.rk=Math.max(P.rk||0,ar+1);arn++;save();return show(`<div>${m}</div><div>${last?`🏆 ${RK[ar][0]}ランク とっぱ!`+(ar<6?`<br>${RK[ar+1][0]}ランクに ちょうせんできる!`:'<br>👑 Sランク せいは! でんせつの ぼうけんしゃだ!'):'つぎの あいてが まっている…'}</div>`,last?[['かえる',aout]]:[['つぎの試合',arena],['かえる',aout]])}if(bs){P.bk['a'+P.a]=1;if(P.a>SEC)P.bc=Math.max(P.bc,P.a-12);else P.cl=Math.max(P.cl,P.a+1);save();return show(`<div style="font-size:48px">${E.e}</div><div>${m}</div>`+(P.a==LAST?'<h3>🎉 ゲームクリア!</h3><div>魔王を たおし、世界に へいわが もどった!<br>ありがとう、なかまたち!<br>🌟 ワープに「ひみつの町」が あらわれた!</div>':'<div>みちが ひらけた!</div>'),P.a==LAST?[['冒険をつづける',()=>{P.x=lx;P.y=ly;hide()}]]:[NX()?['つぎのエリアへ',()=>go(NX())]:['ひみつの町へ',()=>go(SEC)],['この場に とどまる',()=>{P.x=lx;P.y=ly;hide()}]])}
save();show(`<div>${m}</div>`,[['すすむ',hide]])}
function lose(){mode='menu';P.g=Math.floor(P.g/2);healAll();if(!xz)spawn();save();show('<h3>ぜんいん たおれた…</h3><div>おかねが はんぶんに。<br>はじまりの村で めざめた。</div>',[['もういちど',()=>{if(xz){xz=null;P.a=SEC;enterTown()}else hide()}]])}
document.addEventListener('keydown',e=>{if(e.key=='b'||e.key=='i')return bag();const m={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0],w:[0,-1],s:[0,1],a:[-1,0],d:[1,0]}[e.key];if(m){e.preventDefault();move(...m)}});
document.querySelectorAll('#pad button[data-d]').forEach(b=>{const d=b.dataset.d.split(',').map(Number);let t;
const go=()=>move(...d);b.addEventListener('pointerdown',e=>{e.preventDefault();go();t=setInterval(go,170)});
['pointerup','pointerleave','pointercancel'].forEach(ev=>b.addEventListener(ev,()=>clearInterval(t)))});
const FC=['😀','😃','😄','😁','😆','😅','🤣','😂','🙂','🙃','😉','😊','😇','🥰','😍','🤩','😘','😋','😛','😜','🤪','😝','🤑','🤗','🤭','🤔','🤨','😐','😑','😶','😏','😒','🙄','😬','😌','😔','😪','😴','😷','🤒','🤕','🤢','🥵','🥶','🥴','😵','🤯','🤠','🥳','😎','🤓','🧐','😕','😟','🙁','😮','😲','😳','🥺','😦','😧','😨','😰','😥','😢','😭','😱','😖','😣','😞','😓','😩','😫','🥱','😤','😡','😠','🤬','😈'];AR.forEach((a,i)=>{for(let k=0;a.e.length<9&&k<300;k++){const f=FC[(i*13+k*5)%FC.length];if(!a.e.includes(f))a.e.push(f)}});
let pm='field';
function bag(){if(mode!='field'&&mode!='town')return;pm=mode;mode='menu';bagM()}
const bclose=()=>pm=='town'?thide():hide();
function bagM(m){show(`<h3>🎒 もちもの</h3>${P.pt.map(i=>`<div>${CH[i].e}${CH[i].n} HP ${P.m[i].hp}/${mx(i,'hp')} MP ${P.m[i].mp}/${mx(i,'mp')}</div>`).join('')}<div>🌿やくそう×${P.herb}　🧪MP回復薬×${P.mpp}　💰${P.g}G</div><div>⚔️${P.wn||'なし'}　🛡️${P.an||'なし'}</div><div class="lg">${m||''}</div>`,[['🌿やくそうを つかう',()=>pick('h')],['🧪MP回復薬を つかう',()=>pick('m')],['✨かいふくまほう',()=>pick('s')],['📖ボス図鑑',zukan],['とじる',bclose]])}
const bk=['もどる',()=>bagM()],who=f=>P.pt.map(i=>[CH[i].e+CH[i].n+' '+P.m[i].hp+'/'+mx(i,'hp'),()=>f(i)]).concat([bk]);
function pick(k){if(k=='m'){if(P.mpp<1)return bagM('MP回復薬が ない!');return show('<div>だれに つかう?</div>',P.pt.map(i=>[CH[i].e+CH[i].n+' MP '+P.m[i].mp+'/'+mx(i,'mp'),()=>{P.mpp--;P.m[i].mp=Math.min(mx(i,'mp'),P.m[i].mp+30);save();bagM(CH[i].n+'の MPが かいふくした! MP'+P.m[i].mp)}]).concat([bk]))}if(k=='h'){if(P.herb<1)return bagM('やくそうが ない!');return show('<div>だれに つかう?</div>',who(i=>{P.herb--;heal(i,herbV());save();bagM(CH[i].n+'は かいふくした! HP'+P.m[i].hp)}))}
const hs=[];P.pt.forEach(i=>SK[i].forEach(([n,c])=>{if(n.includes('ヒール'))hs.push([i,n,c])}));
if(!hs.length)return bagM('かいふくまほうを つかえる なかまが いない');
show('<div>どの まほうを つかう?</div>',hs.map(([i,n,c])=>[`${CH[i].n} ${n} MP${c}`,()=>{if(P.m[i].mp<c)return bagM('MPが たりない!');const go=t=>{P.m[i].mp-=c;if(t==null)P.pt.forEach(q=>heal(q,MG(i)*2+(n=='ひえひえヒール'?30:20)));else heal(t,MG(i)*4+30);save();bagM(`${CH[i].n}の ${n}! かいふくした`)};n=='ヒール'?show('<div>だれに かける?</div>',who(go)):go()}]).concat([bk]))}

gen();if(P.a==SEC)enterTown();else leave();
